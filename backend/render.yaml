services:
  - type: web
    name: darkai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./darkai.db
      - key: ALLOWED_ORIGINS
        value: https://darkai-app.vercel.app,https://*.vercel.app
